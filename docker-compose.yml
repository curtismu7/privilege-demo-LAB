# OrbStack:  docker compose up --build -d   ->  http://127.0.0.1:4510   (mock mode; nothing else to set up)
# The port is published on 127.0.0.1 only (a test pins that). Do not widen it: mock sign-in has no password.
#
# Live mode (owner-run): to give the container your shared settings file (~/Development/.env, or the file STANDALONE_ENV names), add the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.shared-env.yml up --build -d
# Live mode (owner-run) trusts the access tokens of your PingFederate. Put PF_URL and PF_AUDIENCE in your shell or in a local .env
# next to this file, set DEMO_MODE=live (or press Live in the header), then `docker compose up --build -d`.
# To try the live path with no PingFederate, add the local stub issuer (NOT PingFederate):
#   PF_URL=http://stub-issuer:9031 PF_HTTP_HOSTS=stub-issuer PF_AUDIENCE=privilege-demo docker compose --profile stub up --build -d
#   docker compose exec -T stub-issuer node stub-issuer/mint.mjs priya
name: privilege-demo-lab

services:
  privilege-demo-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-4510}:4510"
    environment:
      PORT: "4510"
      DATA_DIR: /data
      DEMO_MODE: ${DEMO_MODE:-mock}
      # Mock sign-in (rule 11) is allowed here because the port above is published on 127.0.0.1 only; LAB_PUBLISH says so.
      ALLOW_MOCK_SIGNIN: "1"
      LAB_PUBLISH: loopback
      # Extra host names the app answers to besides 127.0.0.1 and localhost; every other Host is refused.
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-}
      PACK: ${PACK:-generic}
      # Passed through from your shell only when set. An empty value here would beat the shared settings file (real variables win).
      PF_URL:
      PF_AUDIENCE:
      PF_HTTP_HOSTS:
    volumes:
      - privilege-demo-data:/data
    networks: [demo]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4510/api/health').then(r=>r.json()).then(j=>process.exit(j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # LOCAL DEMONSTRATION ONLY, not PingFederate. Generates a key pair each start and serves its JWKS. No port is published; it sits on the
  # same user-defined network as the app (http://stub-issuer:9031). Off unless you pass --profile stub.
  stub-issuer:
    profiles: ["stub"]
    build:
      context: .
      target: stub
    networks: [demo]
    environment:
      STUB_ISSUER: http://stub-issuer:9031
      STUB_AUDIENCE: ${PF_AUDIENCE:-privilege-demo}
      STUB_HOST: 0.0.0.0
      PACK: ${PACK:-generic}

networks:
  demo:

volumes:
  privilege-demo-data:
